<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        form {
            border: 1px solid black;
            background-color: rgb(240, 240, 240);
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Formulario</h1>
    <form action="cadrastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusuario">Usuario:</label>
            <input autocomplete="username" text" name="usuario" placeholder="Nome do Usuario" id="iusuario" required>
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" placeholder="Senha do Usuario" required>
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
