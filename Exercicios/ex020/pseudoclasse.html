<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        div:hover {
            color: red;
        }
        div {
            background-color: rgb(73, 73, 73);
            color: white;
            width: 400px;
            border: 1px solid rgb(206, 206, 206);
            height: 100px;
        }
    </style>
</head>
<body>
    <div>Brasileirão 1</div>
    <div>
        Brasileirão 2
        <p>Flamengo</p>
    </div>
    <div>Brasileirão 3</div>
</body>
</html>
