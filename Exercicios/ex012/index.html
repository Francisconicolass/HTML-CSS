<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduzindo Videos</title>
</head>
<body>
    <h1>Abra esse video aqui embaixo</h1>
    <p>Este video está hospedado no meu próprio servidor.</p>
    <video width="300" controls poster="imagens/limoes-capa.png" autoplay>
        <source src="videos/meuvideo3mkv.mp4" type="video/mkv">
        <source src="videos/meuvideo1webm.mp4" type="video/webm">
        <source src="videos/meuvideo2mp4.mp4" type="video/mp4">
    </video>

    <h1>Este video está sendo hospeado fora do meu servidor, no YouTube</h1>
    <iframe width="300" height="200" src="https://www.youtube.com/embed/cDoo53YgQhY?si=KfNj3Sq2PGHmdize" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
