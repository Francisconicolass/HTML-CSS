<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            text-decoration: none;
            color: rgb(33, 6, 94);
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:visited {
            color: rgb(69, 69, 102);
        }

        a:active {
            color: rgb(28, 28, 116);
        }

        a::before {
            content: "⇒";
        }

        a::after {
            content: "⇐";
        }

        .especial {
            background-color: rgb(137, 137, 211);
            border-radius: 10px;
            width: 170px;
            box-shadow: 2px 2px 5px rgb(81, 81, 124);
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li class="especial"><a href="https://www.youtube.com/@cursoemvideo" target="_blank">Canal do Youtube</a></li>
        <li class="especial"><a href="https://github.com/gustavoguanabara" target="_blank">Link do Github</a></li>
        <Li class="especial"><a href="https://www.instagram.com/gustavoguanabara/" target="_blank">Canal do Instagram</a></Li>
    </ul>
</body>
</html>
