<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="cadrastro.php" autocomplete="on" method="get">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required autocomplete="name" placeholder="Nome do Usuario">
        </p>
        <p>
            <label for="nota">Nota:</label>
            <input type="number" name="nota" id="inota" min="0" max="10" placeholder="0 a 10" step="0.1"> 
        </p>
        <p>
            <label for="idata">Data da Prova:</label>
            <input type="date" name="idata" id="idata" required >
        </p>
        <p>
            <label for="ihora">Hora da Prova:</label>
            <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
