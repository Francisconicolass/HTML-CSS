<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        input {
            margin: 5px;
        }
    </style>

</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Faça Corretamente</legend>

            <label for="icor">Cor:</label>
            <input type="color" name="cor" id="icor"><br>

            <label for="isatisfacao">Satisfação</label>
            <input type="range" name="satisfacao" id="isatisfacao"><br>

            <label for="ifoto">Foto do Usuario:</label>
            <input type="file" name="foto" id="ifoto"><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>

    </form>
</body>
</html>
