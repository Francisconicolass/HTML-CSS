<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            border: 1px solid black;
            padding-left: 10px;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr>
            <th>Time</th>
            <th>Vitorias</th>
            <th>Partidas jogadas</th>
        </tr>
        <tr>
            <td>Corinthias</td>
            <td>3.238</td>
            <td>6.234</td>
        </tr>
        <tr>
            <td>Flamengo</td>
            <td>3.604</td>
            <td>6.767</td>
        </tr>
        <tr>
            <td><bolder>Palmeiras</bolder></td>
            <td>3.556</td>
            <td>6.594</td>
        </tr>
    </table>
</body>
</html>
