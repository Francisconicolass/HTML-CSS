<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }
        
        td {
            border: 1px solid black;
            padding: 15px;
            width: 100px;
            text-align: center;
        }

        th {
            border: 1px solid black;
            padding: 8px;
            width: 100px;
            text-align: center;
        }

        .numero {
            text-align: right;
            width: 50px;
        }

        col.cnome {
            background-color: rgba(211, 211, 211, 0.589);
        }

        col.cidade {
            background-color: rgba(211, 211, 211, 0.589);
        }

        col.csexo {
            background-color: rgba(211, 211, 211, 0.096);
        }

        col.cprofissão {
            background-color: rgba(211, 211, 211, 0.096);
        }
    </style>
</head>
<body>
    <h1>Tabelas</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissão">
        </colgroup>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Maria Luiza</td>
            <td>Feminino</td>
            <td class="numero">23</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Lucas Firmino</td>
            <td>Masculino</td>
            <td class="numero">19</td>
            <td>Progamador</td>
        </tr>
        <tr>
            <td>Maria Clara</td>
            <td>Feminino</td>
            <td class="numero">14</td>
            <td>Estudante</td>
        </tr>
    </table>
</body>
</html>
