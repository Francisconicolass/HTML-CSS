<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: red;
            color: white;
            border: 1px solid black;
            text-shadow: 1px 1px 1px black;
            text-align: center;
            flex-basis: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="id1">A</div>
        <div class="item" id="id2">B</div>
        <div class="item" id="id3">C</div>
    </div>
</body>
</html>
